plugins { id 'com.android.application' }
def ks = new Properties(); def ksf = rootProject.file('keystore.properties'); if (ksf.exists()) ks.load(new FileInputStream(ksf))
android {
  namespace 'gr.dimitris.batterycycles'
  compileSdk 36
  defaultConfig {
    applicationId 'gr.dimitris.batterycycles'
    minSdk 30
    targetSdk 36
    versionCode 2
    versionName '1.1'
    ndk { abiFilters 'arm64-v8a' }
  }
  packaging { jniLibs { useLegacyPackaging true }; dex { useLegacyPackaging true } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  signingConfigs { if (ksf.exists()) { release { storeFile file(ks['storeFile']); storePassword ks['storePassword']; keyAlias ks['keyAlias']; keyPassword ks['keyPassword'] } } }
  buildTypes { release { minifyEnabled false; if (ksf.exists()) signingConfig signingConfigs.release } }
}
dependencies {
  implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
  implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
  implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
